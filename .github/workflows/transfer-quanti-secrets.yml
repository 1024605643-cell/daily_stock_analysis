name: Encrypt existing credentials for Quanti
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pynacl==1.6.0
      - name: Encrypt only with destination public key
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('atQMj0rk7EdkADLGiE7KrZWJ8K4H/TMSMcguid10EgM=')))
          result = {}
          for name in ('EMAIL_PASSWORD', 'LLM_PRIMARY_API_KEY'):
              value = os.environ[name]
              if not value:
                  raise RuntimeError(name + ' is missing')
              result[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
          Path('sealed-quanti.json').write_text(json.dumps(result))
          print('Encrypted two credentials; no plaintext exported')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-quanti-credentials
          path: sealed-quanti.json
          retention-days: 1
